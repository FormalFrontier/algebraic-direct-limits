name = "algebraic-direct-limits"
version = "0.1.0"
defaultTargets = ["AlgebraicDirectLimits", "AlgebraicDirectLimitsExamples", "ReadinessTests"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[lean_lib]]
name = "AlgebraicDirectLimits"

[[lean_lib]]
name = "AlgebraicDirectLimitsExamples"
roots = [
  "AlgebraicDirectLimitsExamples.PrimeSpectrumFilteredColimits",
  "AlgebraicDirectLimitsExamples.RingTheory.KrullDimension.FiniteCapture",
  "AlgebraicDirectLimitsExamples.RingTheory.KrullDimension.FiniteCaptureTrace",
  "AlgebraicDirectLimitsExamples.RingTheory.KrullDimension.DirectLimit",
  "AlgebraicDirectLimitsExamples.RingTheory.KrullDimension.DirectedUnion",
  "AlgebraicDirectLimitsExamples.Coinduced",
  "AlgebraicDirectLimitsExamples.Restriction",
  "AlgebraicDirectLimitsExamples.TensorProduct",
  "AlgebraicDirectLimitsExamples.TensorCompactness",
  "AlgebraicDirectLimitsExamples.TensorHom",
  "AlgebraicDirectLimitsExamples.TensorUnit",
  "AlgebraicDirectLimitsExamples.TensorAssociativity",
  "AlgebraicDirectLimitsExamples.TensorSeparation"
]

[[lean_lib]]
name = "ReadinessTests"
srcDir = "tests"
globs = ["CofinalGroupCompletionClient", "FiniteCaptureClient", "GradedStabilizationClient", "MonoidalGroupCompletionClient", "ReadinessClient", "ReadinessTests"]
